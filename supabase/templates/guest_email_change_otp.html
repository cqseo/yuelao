<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>月老 · 綁定郵箱驗證</title>
  </head>
  <body style="margin:0;padding:28px 16px;background:#f6f0e6;font-family:Arial,sans-serif;color:#382a25">
    <main style="max-width:480px;margin:auto;background:#fff;padding:28px;border:1px solid #e5d5bc;border-radius:12px">
      <p style="color:#a37333;font-size:12px;letter-spacing:2px">月老 · 姻緣簿</p>
      <h1 style="font-size:25px">綁定郵箱驗證</h1>
      <p>請在月老網站輸入以下六位數驗證碼。此驗證碼只能使用一次，請勿提供給其他人。</p>
      <p style="font-size:30px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
      <p style="font-size:13px;color:#766961">如果不是你本人操作，請忽略這封郵件。無需回覆。</p>
    </main>
  </body>
</html>
