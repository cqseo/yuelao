name: Cloudflare Preview Only Deploy
on:
  push:
    branches:
      - fix/yuelao-auth-launch-guards-20261109
    paths:
      - ".github/workflows/cloudflare-preview-only.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yuelao-preview-only
  cancel-in-progress: true
jobs:
  preview:
    name: Deploy ONLY yuelao-v2-staging-20261109 to cqseo Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: "c7e30e39bf58e1ad33871164f3cd1818"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_AUTH_ENABLED: "true"
      VITE_GUEST_AUTH_ENABLED: "true"
      VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAF6867ET6r61zXr3"
    steps:
      - name: Verify secure deploy token exists (never print token)
        id: gate
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "PREVIEW_DEPLOY_SKIPPED: CLOUDFLARE_API_TOKEN is not configured in GitHub Actions Secrets"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.ready == 'true'
      - name: Verify safe preview-only flags and compile
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'sites/yuelao/wrangler.jsonc';
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes('"name": "yuelao-v2-staging-20261109"')) process.exit(10);
          if (!source.includes('"SITE_STAGING": "true"')) process.exit(11);
          for (const key of ['AI_CHAT_ENABLED','BILLING_ENABLE_TEST_CHECKOUT','AI_ENABLE_TEST_GENERATION','GUEST_AUTH_ENABLED']) {
            if (!source.includes('"' + key + '": "false"')) process.exit(12);
          }
          console.log('Only the named staging Worker may be deployed; payment, AI and guest signup remain off.');
          NODE
          pnpm --filter yuelao-site build
      - name: Deploy PREVIEW environment only; never touch production
        if: steps.gate.outputs.ready == 'true'
        working-directory: sites/yuelao
        run: pnpm exec wrangler deploy --env staging
# No production deployment; never use user's VPS or attach production Supabase to preview.
