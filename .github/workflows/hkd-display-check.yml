name: HKD reference display and USD checkout

on:
  pull_request:
    paths:
      - "sites/yuelao/**"
      - "packages/core/**"
      - "tools/test-hkd-display.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/hkd-display-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate display-rate and USD charge invariant
        run: pnpm exec tsx tools/test-hkd-display.ts
      - name: Typecheck and build site
        run: pnpm --filter ./sites/yuelao check
