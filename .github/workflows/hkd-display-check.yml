name: HKD checkout and mixed-currency accounting

on:
  pull_request:
    paths:
      - "sites/yuelao/**"
      - "packages/core/**"
      - "tools/test-hkd-checkout.ts"
      - "tools/test-admin-stats.ts"
      - "tools/test-checkout-failure.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/hkd-display-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hkd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: HKD product currency and price invariants
        run: pnpm exec tsx tools/test-hkd-checkout.ts
      - name: Stripe checkout failure and recovery
        run: pnpm exec tsx tools/test-checkout-failure.ts
      - name: Multi-currency admin stats regression
        run: pnpm exec tsx tools/test-admin-stats.ts
      - name: Typecheck and build production site
        run: pnpm --filter ./sites/yuelao check
