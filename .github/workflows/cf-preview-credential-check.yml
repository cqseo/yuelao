name: Cloudflare Preview Credential Readiness
on:
  push:
    branches:
      - fix/yuelao-auth-launch-guards-20261109
    paths:
      - ".github/workflows/cf-preview-credential-check.yml"
permissions:
  contents: read
jobs:
  check:
    name: Check for existing deploy credentials only
    runs-on: ubuntu-latest
    steps:
      - name: Report presence without revealing values
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "DEPLOY_CREDENTIAL_PRESENT=true"
          else
            echo "DEPLOY_CREDENTIAL_PRESENT=false"
          fi
          echo "NO_DEPLOYMENT_PERFORMED"
# Never print credentials or access the user's VPS.
